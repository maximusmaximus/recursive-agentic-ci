name: Recursive Agentic CI Suite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test & Self-Audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bytecode syntax verification (py_compile)
        run: |
          python -c "
          import pathlib, py_compile, sys
          failures = []
          for p in pathlib.Path('.').rglob('*.py'):
              if any(part in {'.git', '__pycache__', 'venv', '.venv'} for part in p.parts):
                  continue
              try:
                  py_compile.compile(str(p), doraise=True)
              except Exception as exc:
                  failures.append((str(p), str(exc)))
          if failures:
              for path, err in failures:
                  print(f'FAIL {path}: {err}', file=sys.stderr)
              sys.exit(1)
          print('All Python modules compiled cleanly.')
          "

      - name: Run unit and integration test suite
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover tests -v

      - name: Dogfood CLI self-audit
        env:
          PYTHONIOENCODING: utf-8
        run: python -m src.cli audit --path .
